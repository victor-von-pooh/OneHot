[project]
name = "onehot"
version = "0.1.0"
description = "Prepare W states (uniform superpositions of one-hot basis states) with Qiskit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hiroki Akita" }]
requires-python = ">=3.10"
dependencies = ["qiskit>=2.6"]

[project.optional-dependencies]
report = ["plotly>=6", "matplotlib>=3.9", "pylatexenc>=2.10"]

[dependency-groups]
experiments = ["onehot[report]", "qiskit-aer>=0.17"]
usecases = ["onehot[report]", "qiskit-aer>=0.17", "qiskit-optimization>=0.7", "scipy>=1.13"]

[tool.uv]
default-groups = ["experiments", "usecases"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
